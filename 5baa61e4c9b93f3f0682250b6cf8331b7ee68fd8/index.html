<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You’re in</title>

    <style>
        :root {
            --bg: hsl(220 13% 95%);
            --card: hsl(0 0% 100%);
            --border: hsl(214 32% 91%);
            --text: hsl(222 84% 5%);
            --muted: hsl(215 16% 47%);
            --primary: hsl(222 84% 5%);
            --radius: 0.75rem;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Roboto", "Oxygen", "Ubuntu", "Cantarell",
                "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 1rem;
        }

        .card {
            max-width: 32rem;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 1.5rem;
            font-size: 0.875rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>You’re in</h1>
        <p>
            This page is protected by a simple client-side password gate.
            If you can see this, the password was correct.
        </p>

        <p class="hint">
            This is intentionally lightweight and not real security.
            <br />
            <a href="https://github.com/chrissy-dev/protected-github-pages">
                View the project on GitHub
            </a>
        </p>
    </main>
</body>

</html>
