<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Password Protected</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">

        <style>
            *,
            *:after,
            *:before {
                box-sizing: border-box;
            }
            body,
            html {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
                font-weight: 400;
                font-size: 14px;
                background: hsl(220, 13%, 95%);
                color: hsl(222.2, 84%, 4.9%);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 16px;
            }

            .protected {
                background: hsl(0, 0%, 100%);
                border: 1px solid hsl(214.3, 31.8%, 91.4%);
                border-radius: 8px;
                box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
                width: 100%;
                max-width: 400px;
            }
            .protected__content {
                padding: 32px;
            }
            .protected__content__heading {
                font-size: 20px;
                font-weight: 600;
                margin: 0 0 8px;
                line-height: 1.4;
                letter-spacing: -0.01em;
            }
            .protected__content__description {
                font-size: 14px;
                color: hsl(215.4, 16.3%, 46.9%);
                margin: 0 0 24px;
            }
            .protected__alert {
                display: none;
                border-radius: 8px 8px 0 0;
                padding: 12px 16px;
                font-size: 14px;
                color: hsl(0, 84.2%, 40.2%);
                background-color: hsl(0, 85.7%, 97.3%);
                border-bottom: 1px solid hsl(0, 72.2%, 90.6%);
            }
            .protected__content__input {
                display: block;
                border: 1px solid hsl(214.3, 31.8%, 91.4%);
                padding: 10px 12px;
                font-size: 14px;
                width: 100%;
                border-radius: 6px;
                margin-bottom: 16px;
                background: hsl(0, 0%, 100%);
                transition: all 0.15s ease;
                font-family: inherit;
            }
            .protected__content__input:focus {
                outline: none;
                border-color: hsl(222.2, 84%, 4.9%);
                box-shadow: 0 0 0 3px hsl(222.2, 84%, 95%);
            }
            .protected__content__input::placeholder {
                color: hsl(215.4, 16.3%, 46.9%);
            }
            .protected__content__btn {
                background-color: hsl(222.2, 84%, 4.9%);
                border-radius: 6px;
                cursor: pointer;
                border: none;
                color: hsl(210, 40%, 98%);
                padding: 10px 16px;
                font-family: inherit;
                font-weight: 500;
                font-size: 14px;
                width: 100%;
                transition: background-color 0.15s ease;
            }
            .protected__content__btn:hover {
                background-color: hsl(222.2, 84%, 8%);
            }
            .protected__content__btn:active {
                transform: translateY(1px);
            }

        </style>

    </head>

    <body>

        <div class="protected">
            <div class="protected__alert" data-id="alert">Incorrect password. Please try again.</div>
            <div class="protected__content">
                <h1 class="protected__content__heading">Password Required</h1>
                <p class="protected__content__description">Enter your password to continue</p>
                <input class="protected__content__input" data-id="password" type="password" placeholder="Enter password"/>
                <button data-id="button" type="button" class="protected__content__btn">Continue</button>
            </div>
        </div>

        <script type="module">
          class PasswordGate {
            constructor() {
              this.elements = {
                alert: document.querySelector('[data-id="alert"]'),
                password: document.querySelector('[data-id="password"]'),
                button: document.querySelector('[data-id="button"]')
              };

              this.init();
            }

            init() {
              this.elements.button.addEventListener('click', () => this.handleSubmit());
              document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                  this.handleSubmit();
                }
              });
            }

            async handleSubmit() {
              const password = this.elements.password.value;
              await this.login(password);
            }

            async hashPassword(password) {
              const encoder = new TextEncoder();
              const data = encoder.encode(password);
              const hashBuffer = await crypto.subtle.digest('SHA-1', data);
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async login(password) {
              const hash = await this.hashPassword(password);
              const url = `${hash}/index.html`;

              try {
                const response = await fetch(url);

                if (response.status >= 200 && response.status < 400) {
                  window.location = url;
                } else {
                  this.handleError(hash);
                }
              } catch (error) {
                this.handleError(hash);
              }
            }

            handleError(hash) {
              parent.location.hash = hash;
              this.elements.alert.style.display = 'block';
              this.elements.password.setAttribute('placeholder', 'Incorrect password');
              this.elements.password.value = '';
            }
          }

          new PasswordGate();
        </script>
    </body>
</html>
